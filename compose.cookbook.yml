services:
  chromadb:
    image: chromadb/chroma:1.3.3
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "echo > /dev/tcp/127.0.0.1/8000",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  chroma-data:
